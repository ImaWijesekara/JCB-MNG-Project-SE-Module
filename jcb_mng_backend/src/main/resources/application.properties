
# SERVER SETTINGS
server.port=8080
spring.application.name=jcb_mng

# DATABASE CONNECTION (MySQL)
# Replace 'jcb_management_db' with your actual database name if it's different
spring.datasource.url=jdbc:mysql://localhost:3306/jcb_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Replace these with your actual MySQL database credentials
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE SETTINGS
# 'update' automatically creates or modifies tables based on your Entity classes
spring.jpa.hibernate.ddl-auto=update

# Shows the SQL queries in your console (super helpful for debugging)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# The correct, modern dialect for Hibernate 6+ (fixes your crash!)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect