# SERVER SETTINGS
server.port=8080
spring.application.name=jcb_mng

# DATABASE CONNECTION (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/jcb_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Replace these with your actual MySQL database credentials
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE SETTINGS
spring.jpa.hibernate.ddl-auto=update

# Shows the SQL queries in your console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Fixed dialect (Removed the -3.)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect